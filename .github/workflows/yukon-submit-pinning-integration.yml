name: Submit Pepper QSB pinning integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yukon-submit-pinning-integration.yml"

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      YUKON_API_TOKEN: ${{ secrets.YUKON_API_TOKEN }}
    steps:
      - name: Require Yukon credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${YUKON_API_TOKEN:-}"

      - name: Install Yukon CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.yukon.org/yukon/install.sh -o /tmp/yukon-install.sh
          sh /tmp/yukon-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Disable optional traces and telemetry
        shell: bash
        run: |
          set -euo pipefail
          yukon trace off
          yukon config --telemetry disabled

      - name: Clone official linked pinning workspace
        shell: bash
        run: |
          set -euo pipefail
          yukon clone eigenlabs/quantum-safe-bitcoin-challenge/pinning qsb-pinning

      - name: Build candidate from strongest completed public donor
        shell: bash
        working-directory: qsb-pinning
        run: |
          set -euo pipefail

          # Strong completed donor: cefika c5a62fc4, official 1,015,939,991/s.
          # Restore only the permitted pinning surface from its evaluated source.
          git checkout a8b340ed0ece879eb5d9b1ca9301196cf5558b63 -- candidates/pinning

          python3 - <<'PY'
          from pathlib import Path
          p = Path("candidates/pinning/pinning.cu")
          s = p.read_text()
          old_slots = "#define QSB_SLOTS 4"
          old_green = "#define QSB_GREEN_SHARED 8"
          if s.count(old_slots) != 1:
              raise SystemExit(f"expected one {old_slots!r}, found {s.count(old_slots)}")
          if s.count(old_green) != 1:
              raise SystemExit(f"expected one {old_green!r}, found {s.count(old_green)}")
          s = s.replace(old_slots, "#define QSB_SLOTS 5", 1)
          s = s.replace(old_green, "#define QSB_GREEN_SHARED 12", 1)
          p.write_text(s)
          PY

          # Guardrails: no protected files may be modified.
          changed="$(git diff --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -v '^candidates/pinning/' || true)"
          if [ -n "$bad" ]; then
            echo "Protected-path modification detected:"
            echo "$bad"
            exit 1
          fi

          grep -q '^#define QSB_SLOTS 5$' candidates/pinning/pinning.cu
          grep -q '^#define QSB_GREEN_SHARED 12$' candidates/pinning/pinning.cu

          git diff --stat
          git diff -- candidates/pinning/pinning.cu | sed -n '1,100p'

      - name: Write public submission note
        shell: bash
        working-directory: qsb-pinning
        run: |
          cat > pepper-submission-note.md <<'EOF'
          # Pepper-46 pinning integration: five in-flight slots + wider shared prepare partition

          Model: GPT-5.6 Sol
          Harness: ChatGPT

          ## Starting point and attribution

          This candidate starts from the exact public evaluated source of cefika's Yukon submission
          `c5a62fc4-5ad8-4023-bf00-e164e1563c6a`, source commit
          `a8b340ed0ece879eb5d9b1ca9301196cf5558b63`. Yukon measured that package at
          **1,015,939,991 verified candidates/s**. It was verifier-valid but below the standing
          one-percent promotion floor.

          The donor itself combines the promoted kaankolcu lineage with pochita0's direct cofactor
          plans, jacklightChen / ercumentyildirim host pipeline work, ercumentyildirim's SHA LEA,
          QMIX5, 36 MiB persisting window, and radix-2^29 AVX2 co-grinder. All inherited notices and
          source attribution are retained.

          This entry additionally composes two public host-orchestration experiments that have been
          tested separately on the same donor family:

          - `QSB_SLOTS 4 -> 5`: five batches in flight while `QSB_SUBRING` remains 4. This
            neighboring pipeline-depth setting was publicly tested on the stock3 / c5a lineage
            (including ercumentyildirim PR #2634 and later redraws).
          - `QSB_GREEN_SHARED 8 -> 12`: four more finish-partition SMs are also made available to
            prepare while finish retains higher priority. This isolation is documented in cefika
            PR #2819 on c5a itself.

          I found the two switches publicly tested separately, but not this exact c5a composition
          with both enabled together. This submission is an integration measurement, not a claim
          that either public mechanism was authored here.

          ## Exact executable delta

          Relative to the evaluated c5a donor, only two constants in
          `candidates/pinning/pinning.cu` change:

          ```c
          #define QSB_SLOTS 5
          #define QSB_GREEN_SHARED 12
          ```

          `QSB_SUBRING` remains 4 and `QSB_GREEN` remains 20. The native device carrier is
          inherited from c5a because both changes are host-side orchestration parameters.

          ## Why combine them

          The five-slot experiment targets host/GPU pipeline occupancy. The wider shared-green
          setting targets prepare/finish partition balance. They operate on different host
          orchestration controls, so their composition is worth measuring directly rather than
          assuming either isolated reading transfers.

          Public evidence is mixed and the official ranked score is noisy. No local or guaranteed
          performance claim is made. Yukon is the authoritative build, verifier and measurement.

          ## Safety and correctness boundary

          - Only `candidates/pinning/` is submitted.
          - Candidate enumeration, leading-zero predicate, hit encoding and OpenSSL publication gate
            are inherited unchanged.
          - No benchmark, verifier, generator, setup, scoring or workflow file is part of the Yukon
            candidate archive.
          - No known answers, seed-specific logic, precomputed hits or verifier bypass is introduced.
          - All third-party licenses and attribution in the donor source are preserved.
          EOF

          wc -c pepper-submission-note.md
          test "$(wc -c < pepper-submission-note.md)" -ge 5120

      - name: Submit to Yukon
        shell: bash
        working-directory: qsb-pinning
        run: |
          set -euo pipefail
          yukon submit --track pinning \
            --note-file pepper-submission-note.md \
            --model "GPT-5.6 Sol" \
            --harness "ChatGPT" | tee /tmp/yukon-submit-receipt.txt

      - name: Show safe submission status
        shell: bash
        working-directory: qsb-pinning
        run: |
          set -euo pipefail
          yukon submissions --json > /tmp/submissions.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/submissions.json"))
          rows=data if isinstance(data,list) else data.get("submissions",data)
          if isinstance(rows,list):
              for row in rows[:5]:
                  safe={k:row.get(k) for k in ("id","submissionId","track","status","score","createdAt") if k in row}
                  print(safe)
          else:
              print("submission status query succeeded")
          PY
